kind = "web"
previewPath = "/"
title = "ASHQ — Merchant Export"
version = "1.0.0"
id = "artifacts/ashq-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20394

[services.development]
run = "pnpm --filter @workspace/ashq-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ashq-website", "run", "build" ]
publicDir = "artifacts/ashq-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20394"
BASE_PATH = "/"
